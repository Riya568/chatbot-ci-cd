name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to GCP (Workload Identity)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/512038509774/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-actions@riya-483504.iam.gserviceaccount.com"

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t \
        ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chatbot-repo/chatbot:latest .

    - name: Push Docker image
      run: |
        docker push \
        ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chatbot-repo/chatbot:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy chatbot-service \
          --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/chatbot-repo/chatbot:latest \
          --region=${{ secrets.GCP_REGION }} \
          --allow-unauthenticated
