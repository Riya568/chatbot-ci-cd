# force-redeploy
name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/512038509774/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-actions@riya-483504.iam.gserviceaccount.com"

    - uses: google-github-actions/setup-gcloud@v2

    - run: gcloud auth configure-docker us-central1-docker.pkg.dev

    - run: docker build -t us-central1-docker.pkg.dev/riya-483504/chatbot-repo/chatbot:latest .

    - run: docker push us-central1-docker.pkg.dev/riya-483504/chatbot-repo/chatbot:latest

    - run: |
        gcloud run deploy chatbot-service \
          --image=us-central1-docker.pkg.dev/riya-483504/chatbot-repo/chatbot:latest \
          --region=us-central1 \
          --allow-unauthenticated

